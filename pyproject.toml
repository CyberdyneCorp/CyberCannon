[project]
name = "cybercanon"
version = "0.1.0"
description = "CyberCanon — the versioned canon of a game project: one verifiable contract per asset."
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "trimesh>=4.4",
    "pygltflib>=1.16",
    "numpy>=1.26",
    # Draco, for the compressed preview D7 asks for. Capped below 2.1 on purpose:
    # 2.1.0 publishes no macOS arm64 wheel, so uv would fall back to the sdist and
    # need a C++ toolchain on every Apple Silicon machine. 2.0.0 ships wheels for
    # macOS x86_64 and arm64, manylinux x86_64 and aarch64, and Windows — no
    # compiler anywhere we run. Lift the cap when an arm64 wheel returns.
    "dracopy>=2.0,<2.1",
    "fastmcp>=2.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "httpx>=0.28.1",
    # The hosted surface's two stateful backings. Both are deployed by
    # `add-coolify-deployment`, and both are rebuildable by specification: the
    # index is dropped and rebuilt from the working copy, the mirror is emptied
    # and re-mirrored, and neither is ever the source of truth.
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    # CyberdyneAuth's two halves. `joserfc` verifies an issuer-signed JWT against
    # a published JWKS — a signature check is not something this repository is
    # going to hand-roll — and `keyring` puts the command line's credential in
    # the operating system's credential store, which `auth-integration` requires
    # and which is the whole reason no token is ever written beside a repository.
    # Both are named here rather than relied on transitively: they are imported
    # by `adapters/outbound/auth`, and an undeclared import is a dependency that
    # disappears the day something else stops pulling it in.
    "joserfc>=1.7.5",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "import-linter>=2.1",
    "ruff>=0.6",
    "complexipy>=2.0",
    "pytest-bdd>=8.1",
    "pytest-xdist>=3.6",
    "playwright>=1.47",
    # A real PostgreSQL, as a wheel. The `SearchIndex` conformance suite runs the
    # same contract against the in-memory fake, SQLite and PostgreSQL, and a
    # PostgreSQL that only runs where somebody happens to have a server is a
    # conformance suite that does not run — which is the same failure as a fake
    # that lies. `pgserver` ships the server binaries for macOS and manylinux, so
    # the suite needs no daemon, no container and no credential.
    "pgserver>=0.1.4",
    # An in-process S3, for the same reason: `S3BlobStore` is exercised against a
    # real S3 API rather than against a mock this repository wrote.
    "moto[s3]>=5.0",
]

# The `canon` binary. It is the only script this project installs: the API and
# the MCP server are deployables with their own entry points, and the CLI is the
# one thing a person types.
[project.scripts]
canon = "cybercanon.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ``cybercanon`` is a PEP 420 namespace package with two portions: the hexagonal
# core under libs/ and the deployables under services/. Both map onto the same
# import namespace, so services/cybercanon/cli is ``cybercanon.cli``.
[tool.hatch.build.targets.wheel]
packages = ["libs/cybercanon", "services/cybercanon"]
dev-mode-dirs = ["libs", "services"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers --strict-config -p canon_bdd.plugin"
# A test's layer is its directory (canon_bdd.plugin marks it), so `-m unit`
# selects tests/unit and nothing else. Step modules are named after their
# capability rather than test_*, so collection has to be told about them.
python_files = ["test_*.py", "steps/*.py"]
markers = [
    "unit: domain and application, pure, no I/O (tests/unit)",
    "bdd: generated spec scenarios and the traceability gates (tests/bdd)",
    "conformance: one parametrised suite per port, fake and real adapter (tests/conformance)",
    "e2e: Playwright and `canon` subprocess runs; excluded from `just check` (tests/e2e)",
    "tooling: verifies the build itself — justfile, CI, generator, gates (tests/tooling)",
    "integration: exercises real files or real adapters; excluded from the fast suite",
]

[tool.coverage.run]
# D7 (add-test-strategy): coverage thresholds apply to the domain package only.
# The domain is pure, so a gap there is a rule nobody tested; a number on the
# adapters would only buy tests written to move the number.
source = ["cybercanon.domain"]

[tool.coverage.report]
show_missing = true
fail_under = 90

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "services", "tools", "tests", "scripts"]
# ruff formats Python code blocks inside Markdown. The specs under openspec/ are
# frozen prose and must never be rewritten by a formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

# ---------------------------------------------------------------------------
# Layering contract (D10) — domain <- application <- adapters
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["cybercanon.domain", "cybercanon.application", "cybercanon.adapters"]
include_external_packages = true
contract_types = ["stdlib_only: canon_lint.contracts.StdlibOnlyContract"]

[[tool.importlinter.contracts]]
name = "Hexagonal layers: domain <- application <- adapters"
type = "layers"
layers = ["cybercanon.adapters", "cybercanon.application", "cybercanon.domain"]

[[tool.importlinter.contracts]]
name = "Inbound adapters must not import outbound adapters"
type = "forbidden"
source_modules = ["cybercanon.adapters.inbound"]
forbidden_modules = ["cybercanon.adapters.outbound"]

# The HTTP adapter is covered by the contract above, which forbids the whole
# inbound package from reaching an outbound one. It is named again, on its own,
# because a contract that fails by name is what tells the person who added the
# import which surface they broke — and because this is the adapter the product
# has the most to lose from: a "Validate" button that disagrees with
# `canon validate` is the bug CyberCanon exists to prevent.
[[tool.importlinter.contracts]]
name = "The HTTP adapter must not import outbound adapters"
type = "forbidden"
source_modules = ["cybercanon.adapters.inbound.http"]
forbidden_modules = ["cybercanon.adapters.outbound"]

[[tool.importlinter.contracts]]
name = "The domain imports no third-party package"
type = "stdlib_only"
modules = ["cybercanon.domain"]

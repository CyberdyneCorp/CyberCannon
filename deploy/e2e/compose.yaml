# Task 6.2 — the stack the end-to-end suite runs against.
#
# This is the **test** stack, not the deployment. The images Coolify promotes
# are `add-coolify-deployment`'s (sprints S10-S12); what is here is the smallest
# thing that puts a real browser in front of a real API in front of a real
# PostgreSQL and a real S3 API, because everything smaller is a suite that
# checks the mocks agree with each other.
#
# It is brought up and torn down by the run itself — `tests/e2e/stack.py` — so
# `just test-e2e` stays one command and an interrupted run cannot leak a
# container into the next one.
#
# Every service declares a health check, so `docker compose up --wait` is what
# "it is ready" means here rather than a sleep somebody tuned once.

name: cybercanon-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canon
      POSTGRES_PASSWORD: canon
      POSTGRES_DB: canon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canon -d canon"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # The index is rebuildable by specification, and an e2e run wants a new
      # one every time: no volume, so a stale schema cannot survive a run.
      - /var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: canon
      MINIO_ROOT_PASSWORD: canon-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  # The repository the working copy is fetched from. Git is the source of truth,
  # so the stack has to contain one rather than stub it; the seed is the worked
  # example, served over the git daemon's read-only protocol.
  repository:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "/seed/serve.sh"]
    volumes:
      - ../../examples/ronin:/seed/ronin:ro
      - ./serve-repository.sh:/seed/serve.sh:ro
    healthcheck:
      # What the api is actually going to do, rather than whether a port is
      # open: `git daemon` binds before it can serve anything, and a stack that
      # reported the repository healthy while a clone of it fails would move the
      # failure into the api's own start-up, where it reads as the api's fault.
      test: ["CMD-SHELL", "git ls-remote git://localhost:9418/ronin HEAD >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  # CyberdyneAuth, in the stack rather than stubbed. `CANON_AUTH_KEY_SET_URL`
  # used to name `http://api:8000/e2e-issuer/jwks.json` and **nothing served
  # it**: the api's catch-all refuses any path carrying no surface version, so
  # the key set retrieval answered 400, no credential could ever verify, and
  # the browser suites could only ever assert the signed-out half of the
  # application. Every screenshot this project has ever taken was limited by
  # that one line.
  #
  # It is `tools/canon_issuer` — the same issuer the port-conformance,
  # integration and BDD layers mint and rotate real RSA-signed credentials with
  # — behind a socket. Who it signs in is this block's decision, not the
  # module's: the role keys below are the ones `CANON_AUTH_GROUP_ROLES` maps, and
  # the project is the one `CANON_PROJECT` serves, so an actor arrives entitled
  # to read it.
  issuer:
    build:
      context: ../..
      dockerfile: deploy/e2e/issuer.Dockerfile
    environment:
      # The address a credential names itself issued by, and the address the
      # browser reaches — one string, because the `iss` claim the api checks
      # against `CANON_AUTH_ISSUER` is the one the browser is redirected to.
      # The api retrieves the key set at `http://issuer:9000` instead, on the
      # compose network, which is exactly why the service declares the issuer
      # and the key set address as two settings.
      ISSUER_URL: http://localhost:9000
      ISSUER_AUDIENCE: cybercanon-e2e
      ISSUER_CLIENT_ID: cybercanon-web
      ISSUER_SUBJECT: auth|rafa
      # The claims CyberdyneAuth actually emits. There is no name, no email and
      # no `git_emails` on a real access token, so there are none here either —
      # a person's commit addresses come from `.canon/actors.yaml` (D13). The
      # role keys below are written into the token prefixed with
      # `ISSUER_CLIENT_ID`, exactly as the real issuer writes them.
      #
      # The organisation is what decides whether this person reads the project
      # at all, and it must be the same string the api is given as
      # `CANON_AUTH_ORG_ID`: a stack where the two differ signs somebody in and
      # then shows them nothing, which reads as an empty project rather than as
      # a misconfiguration. It is an invented identifier — nothing in this
      # repository names a real organisation.
      ISSUER_ORG_ID: org_F1xture0Studio
      ISSUER_ORG_SHORT_NAME: fixture-studio
      ISSUER_ROLES: artists
      # Billing products, which is all `entitlements` has ever been. It is not
      # access and it names no project: this stack's person reads `ronin`
      # because they are in the organisation and hold a role on this client.
      ISSUER_ENTITLEMENTS: pro:monthly
    ports:
      # Published because the browser is redirected here from the host. The
      # code exchange is not posted from the browser: the web application's
      # server relays it, over the compose network (`CANON_AUTH_INTERNAL_URL`).
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ../..
      dockerfile: deploy/e2e/api.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      repository: {condition: service_healthy}
      issuer: {condition: service_healthy}
    environment:
      # The address the project is served at, and therefore the identity every
      # project-keyed decision underneath is made with: the entitlement, the
      # index rows and the working-copy directory. Deliberately *not* derived
      # from the repository URL or from `.canon/project.yaml`, which disagree.
      CANON_PROJECT: ronin
      CANON_REPOSITORY_URL: git://repository:9418/ronin
      CANON_REPOSITORY_BRANCH: main
      CANON_REPOSITORY_CREDENTIAL: unused-for-the-git-protocol
      CANON_FETCH_INTERVAL_S: "60"
      CANON_WEBHOOK_SECRET: e2e-webhook-secret
      # The issuer identifier is the browser-facing address, because that is
      # what the `iss` claim of a credential minted for a person in a browser
      # says. The key set is retrieved over the compose network instead: these
      # are two addresses for one service and the service declares them
      # separately for exactly this reason.
      CANON_AUTH_ISSUER: http://localhost:9000
      CANON_AUTH_AUDIENCE: cybercanon-e2e
      # The client the issuer prefixes every role with, and the one the api
      # filters on: `ISSUER_CLIENT_ID` above writes `<client id>:artists` into
      # the token, and an api told a different client id would read a signed-in
      # person as holding nothing at all.
      CANON_AUTH_CLIENT_ID: cybercanon-web
      CANON_AUTH_KEY_SET_URL: http://issuer:9000/jwks.json
      CANON_AUTH_GROUP_ROLES: art-directors=ART_DIRECTOR,artists=ARTIST
      # The organisation this deployment belongs to. A person reads the project
      # only if their `orgs` claim carries this id *and* they hold a role on
      # this client — membership alone is not access and a role alone is not
      # membership. It matches `ISSUER_ORG_ID` above, and it is configuration
      # rather than a constant precisely so that no org id is written into the
      # product.
      CANON_AUTH_ORG_ID: org_F1xture0Studio
      CANON_DATABASE_URL: postgresql://canon:canon@postgres:5432/canon  # not-a-credential: created and destroyed by the run
      CANON_OBJECT_STORE_URL: http://canon:canon-secret@minio:9000/canon-e2e  # not-a-credential: created and destroyed by the run
      CANON_LINK_EXPIRY_S: "900"
      # D7's pair, and the reason it is a pair: the drain window must be longer
      # than the write-back budget. Both are *required* settings
      # (`cybercanon.adapters.wiring.configuration.REQUIRED`), so a stack
      # missing them is not a stack with a shorter timeout — it is an api that
      # refuses to start, naming them, and a compose `up --wait` that fails with
      # no assertion ever running. `tests/tooling/test_e2e_stack.py` reads this
      # block against that table so the two cannot drift again.
      CANON_WRITE_BACK_TIMEOUT_S: "30"
      CANON_DRAIN_WINDOW_S: "60"
      # The browser loads the application from `localhost:5173` and calls this
      # API at `localhost:8000`: two origins, so without this the browser
      # refuses every response the application already received. Exactly the
      # split `deploy/coolify.yaml` has between `canon.backend` and
      # `api.backend`, which is why the stack reproduces it rather than putting
      # both behind one host.
      CANON_WEB_ORIGINS: http://localhost:5173
    ports:
      # Published because the browser reaches the API from the host, which is
      # where `PUBLIC_CANON_API_URL` is resolved.
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 3s
      timeout: 5s
      retries: 40

  web:
    build:
      context: ../..
      dockerfile: deploy/e2e/web.Dockerfile
    depends_on:
      api: {condition: service_healthy}
      issuer: {condition: service_healthy}
    environment:
      PUBLIC_CANON_API_URL: http://localhost:8000
      # Sign-in, which the application reads at run time through
      # `$env/dynamic/public`. Without these three the application serves every
      # screen and states that sign-in is unavailable — which is what it did
      # for as long as the key set address named nothing, and why no signed-in
      # screen was ever exercised. The redirect address is deliberately absent:
      # it is the origin the person is on plus `/signed-in`, so a preview
      # deployment cannot send people back to another one by inheriting a value.
      PUBLIC_CANON_AUTH_ISSUER: http://localhost:9000
      PUBLIC_CANON_AUTH_CLIENT_ID: cybercanon-web
      PUBLIC_CANON_AUTH_AUDIENCE: cybercanon-e2e
      # The web server reads the discovery document and relays the token
      # exchange itself (CyberdyneAuth answers no cross-origin request from a
      # browser), and inside this network the issuer is `issuer:9000`, not the
      # `localhost:9000` the browser and the `iss` claim use. The web
      # application's counterpart of the api's `CANON_AUTH_KEY_SET_URL`.
      CANON_AUTH_INTERNAL_URL: http://issuer:9000
      # adapter-node assumes https when nothing says otherwise, and SvelteKit
      # refuses a form POST whose Origin is not the one it computes. The token
      # relay is a form POST from `http://localhost:5173`, so the origin is
      # stated. Coolify serves https and needs nothing here.
      ORIGIN: http://localhost:5173
      PORT: "5173"
      HOST: "0.0.0.0"
    ports:
      # `tests/e2e/stack.py` points the browser here. The API is published too,
      # because the browser reaches it from the host, not from the network.
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
